[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "congo80rox-injectguard_jd275"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出提示注入防护工程师·KV Cache 复用与前缀共享上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "congo80rox" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://congo80rox.github.io"
Repository = "https://github.com/congo80rox/injectguard_jd275"
Issues = "https://github.com/congo80rox/injectguard_jd275/issues"

[project.scripts]
injectguard_jd275 = "injectguard_jd275:main"

[tool.setuptools]
py-modules = ["injectguard_jd275"]
